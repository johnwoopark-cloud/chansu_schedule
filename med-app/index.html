<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#F4F6F9; --card:#FFFFFF; --line:#E3E7ED; --line2:#E8ECF1; --ink:#16202A; --ink2:#3A4652; --muted:#5B6673;
  --blue:#1F4FC4; --blue-soft:#EAF0FD; --green:#1F8A5B; --green-ink:#146B45; --green-soft:#EAF6EF; --green-line:#A9D8BF;
  --orange:#B85A00; --orange-soft:#FFF1E3; --orange-line:#F0B37A; --chip:#F7F9FB; --chip-line:#D5DBE3;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.55;cursor:default}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:var(--blue)}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:14px 12px 10px 16px;display:flex;align-items:center;gap:8px}
.top .ttl{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.top .date{font-size:13px;color:var(--muted)}
.top h1{margin:0;font-size:20px;font-weight:800}
.who{display:flex;gap:2px;background:#EEF1F5;border-radius:999px;padding:4px;flex-shrink:0}
.who button{border:none;border-radius:999px;padding:8px 11px;min-height:36px;font-size:14px;font-weight:500;background:transparent;color:var(--muted)}
.who button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(22,32,42,.15)}
.iconbtn{border:none;background:transparent;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink2);flex-shrink:0}
main{flex:1;padding:16px 16px 110px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.done{background:var(--green-soft);border-color:var(--green-line)}
.row{display:flex;align-items:center;gap:12px;padding-top:10px;border-top:1px solid var(--line2)}
.row .info{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.name{font-size:15px;font-weight:700}
.name small{font-size:15px;font-weight:500;color:var(--ink2)}
.sub{font-size:13px;color:var(--muted)}
.sub.ok{color:var(--green-ink);font-weight:600}
.sub.warn{color:var(--orange);font-weight:600}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.h2{font-size:15px;font-weight:700}
.slot-time{font-size:18px;font-weight:800}
.btn{min-width:88px;min-height:44px;border-radius:12px;border:none;background:var(--blue);color:#fff;font-size:15px;font-weight:700;flex-shrink:0;padding:0 12px}
.btn.done{background:#fff;border:1.5px solid var(--green);color:var(--green-ink)}
.btn.outline{background:#fff;border:1.5px solid var(--blue);color:var(--blue)}
.btn.orange{background:var(--orange);color:#fff}
.btn.ghost{background:var(--blue-soft);color:var(--blue);min-width:0;min-height:40px;font-size:14px}
.btn.wide{width:100%;min-height:52px;font-size:16px;border-radius:14px}
.btn.gray{background:#D5DBE3;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.chips.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.chip{min-height:40px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--chip-line);background:var(--chip);color:#2A3540;font-size:14px;font-weight:500}
.chip.on{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:600}
.alert{background:var(--orange-soft);border:1px solid var(--orange-line);color:#7A3A00;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500;display:flex;flex-direction:column;gap:10px}
.alert .acts{display:flex;gap:8px;flex-wrap:wrap}
.alert .acts button{min-height:40px;border-radius:10px;padding:0 14px;font-size:14px;font-weight:700;border:1.5px solid #D98C45;background:#fff;color:#7A3A00}
.alert .acts button.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.bar{flex:1;height:8px;background:#E8ECF1;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--green)}
.bar i.low{background:#D9822B}
label.lbl,.lbl{font-size:14px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field textarea{border:1px solid #CDD4DD;border-radius:10px;padding:11px 12px;width:100%;background:#fff}
.field textarea{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:12px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
nav.tabs button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;min-height:56px;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs button.on{color:var(--blue);font-weight:700}
.toast.err{background:#8A2C00}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;width:calc(100% - 32px);max-width:448px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:500}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(22,32,42,.45);display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-width:480px;width:100%;margin:0 auto;max-height:92vh;overflow-y:auto}
.cal-head,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-head span{text-align:center;font-size:12px;color:var(--muted)}
.cal button{min-height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;background:var(--chip);border:1.5px solid transparent;color:var(--ink);font-size:13px;font-weight:600}
.cal button.today{background:var(--blue-soft);border-color:var(--blue)}
.cal button.sel{border-color:var(--ink)}
.cal button.future{color:#9AA4B0}
.cal .blank{min-height:52px}
.dots{display:flex;gap:3px;height:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.dot.miss{background:transparent;border:1.5px solid #8A95A3}
.szmark{font-size:10px;font-weight:700;color:var(--orange)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.badge.test{background:#EEF1F5;color:var(--ink2)}
.badge.hosp{background:var(--green-soft);color:var(--green-ink)}
.vtext{font-size:14px;color:var(--ink);white-space:pre-line;line-height:1.55;overflow-wrap:anywhere}
.vtext.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.vlabel{font-size:12px;font-weight:700;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);padding-top:6px;border-top:1px solid #EEF1F5}
.legend span{display:flex;align-items:center;gap:5px}
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-size:20px;font-weight:800}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}
.daybar .lbl2{display:flex;flex-direction:column;align-items:center;gap:1px}
.daybar .lbl2 b{font-size:16px}
.navbtn:disabled{opacity:.35}
.navbtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;font-size:18px;color:var(--ink2)}
.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;gap:16px;max-width:480px;margin:0 auto}
.center h1{margin:0;font-size:24px;font-weight:800}
.center p{margin:0;font-size:15px;line-height:1.6;color:var(--ink2)}
.list{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink2)}
.list div{display:flex;gap:8px}
.spinner{width:28px;height:28px;border:3px solid #D5DBE3;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spinner" aria-label="불러오는 중"></div></div></div>
<script>
var URL_KEY = <?!= jsonForHtml_(urlKey) ?>;
var APP_URL = <?!= jsonForHtml_(appUrl) ?>;
// Code.gs의 APP_VERSION과 같아야 한다
var CLIENT_VERSION = '7';
// 상담대비 기록 탭 켜기/끄기. 숨기려면 false로 바꾸고 새 버전으로 배포 (기존 기록은 시트에 그대로 있음)
var SHOW_SEIZURE = true;

var DUR = ['10분 이상', '30분 이상', '1시간 이상'];
var SZ_TYPES = ['전신 떨림', '부분 떨림', '멍해짐', '기타'];
var SZ_SITS = ['수면 중', '기상 직후', '잠들기 전', '공부 중', '게임 중', '핸드폰 중', '일상생활 중', '기타'];
var SZ_AURA = ['이상한 냄새', '이상한 소리', '쓴맛', '기시감', '공포감', '복부 압박감', '없음/모름'];
var SZ_MED = ['제때 복용', '미복용', '늦게 복용'];
var TIME_CHOICES = ['07:00', '08:00', '09:00', '12:00', '13:00', '18:00', '19:00', '20:00', '21:00', '22:00'];

var S = {
  screen: 'loading', key: '', who: '', people: ['엄마', '아빠', '아이'], tab: 'today',
  visits: null, vfilter: '전체', vform: null, vopen: null,
  day: '', data: null, warn: null, pendingPrn: null, reason: '두통', busy: false, toast: '',
  sheet: null, form: null, sz: null, month: null, monthData: null, selDay: null, justRegistered: false
};

// ───── 저장소 (이 폰에만 저장) ─────
function store(k, v) { try { if (v == null) localStorage.removeItem('medapp.' + k); else localStorage.setItem('medapp.' + k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem('medapp.' + k) || ''; } catch (e) { return ''; } }

// ───── 서버 호출 ─────
var OUTDATED = '서버 코드(Code.gs)가 예전 버전이에요. Code.gs를 최신으로 붙여넣고 새 버전으로 배포해 주세요.';
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) {
      var msg = (err && err.message) || String(err);
      if (msg.indexOf('AUTH') >= 0) { logout(true); return; }
      reject(new Error(msg));
    });
    if (typeof r[fn] !== 'function') { reject(new Error(OUTDATED)); return; }
    r[fn].apply(r, args);
  });
}
function act(fn) {
  if (S.busy) return Promise.resolve(null);
  S.busy = true; render();
  var args = Array.prototype.slice.call(arguments, 1);
  return call.apply(null, [fn, S.key].concat(args)).then(function (res) {
    S.busy = false;
    if (res && res.state) S.data = res.state;
    render();
    return res;
  }, function (err) {
    S.busy = false; toast('저장하지 못했어요: ' + (err.message.replace(/^Error:\s*/, '') || '다시 시도해 주세요.'), true);
    render();
    return null;
  });
}

// ───── 시작 / 등록 / 로그아웃 ─────
function start() {
  var saved = load('key');
  var candidate = URL_KEY || saved;
  if (!candidate) { S.screen = 'needLink'; render(); return; }
  call('api_checkKey', candidate).then(function (res) {
    S.people = res.people || S.people;
    S.versionMismatch = res.version !== CLIENT_VERSION;
    if (!res.ok) {
      if (URL_KEY) { S.screen = 'badLink'; }
      else { store('key', null); S.screen = 'loggedOut'; }
      render(); return;
    }
    S.key = candidate;
    if (URL_KEY && URL_KEY !== saved) { store('key', URL_KEY); S.justRegistered = true; }
    S.who = S.people.indexOf(load('who')) >= 0 ? load('who') : '';
    if (!S.who) { S.screen = 'chooseWho'; render(); return; }
    enterMain();
  }, function (err) { S.screen = 'error'; S.error = err.message; render(); });
}
function enterMain() {
  S.screen = 'main';
  refresh();
}
function refresh() {
  var want = S.day;
  return call('api_today', S.key, want).then(function (d) { if (S.day === want) { S.data = d; render(); } }, function (e) { toast('불러오지 못했어요: ' + e.message, true); });
}
function logout(byServer) {
  store('key', null); store('who', null);
  S.key = ''; S.who = ''; S.data = null; S.sheet = null;
  S.screen = byServer ? 'loggedOut' : 'loggedOutSelf';
  render();
}

// ───── 화면 공통 ─────
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(msg, isError) {
  S.toast = msg; S.toastErr = !!isError; render();
  clearTimeout(toast.t);
  toast.t = setTimeout(function () { S.toast = ''; render(); }, isError ? 7000 : 2800);
}
function chip(label, on, action, value) {
  return '<button class="chip' + (on ? ' on' : '') + '" aria-pressed="' + on + '" data-act="' + action + '" data-v="' + esc(value == null ? label : value) + '">' + esc(label) + '</button>';
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function shiftDay(ymd, n) {
  var p = ymd.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
  return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
}
function relDay(ymd, today) {
  var p = ymd.split('-').map(Number), q = today.split('-').map(Number);
  var n = Math.round((Date.UTC(q[0], q[1] - 1, q[2]) - Date.UTC(p[0], p[1] - 1, p[2])) / 86400000);
  return n === 0 ? '오늘' : n === 1 ? '어제' : n === 2 ? '그제' : n + '일 전';
}
function nowHM() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function todayYMD() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function iGa(word) { var c = word.charCodeAt(word.length - 1); return (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? '이' : '가'; }

var ICON = {
  pill: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7z"/><path d="m8.5 8.5 7 7"/></svg>',
  pen: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  clip: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/></svg>',
  cal: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  gear: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  warn: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B85A00" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>'
};

// ───── 화면 그리기 ─────
function render() {
  var app = document.getElementById('app');
  var scrollY = window.scrollY;
  var h;
  if (S.screen === 'main') h = renderMain();
  else h = renderGate();
  if (S.toast) h += '<div class="toast' + (S.toastErr ? ' err' : '') + '" role="status">' + esc(S.toast) + '</div>';
  app.innerHTML = h;
  if (S.screen === 'main') window.scrollTo(0, scrollY);
}

function renderGate() {
  var s = S.screen;
  if (s === 'loading') return '<div class="center"><div class="spinner" aria-label="불러오는 중"></div></div>';
  if (s === 'chooseWho') {
    return '<div class="center"><h1>이 폰은 누가 쓰나요?</h1><p>기록할 때 이름이 함께 남아요. 나중에 위쪽 버튼으로 언제든 바꿀 수 있어요.</p>' +
      '<div class="chips grid2" style="grid-template-columns:repeat(3,minmax(0,1fr))">' +
      S.people.map(function (p) { return '<button class="btn" style="min-height:56px" data-act="pickFirstWho" data-v="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') +
      '</div></div>';
  }
  var title, body;
  if (s === 'needLink') { title = '등록이 필요해요'; body = '가족에게 받은 <b>가족 주소</b>(비밀 키가 붙은 주소)를 이 폰에서 한 번 열어 주세요.'; }
  else if (s === 'badLink') { title = '주소가 맞지 않아요'; body = '비밀 키가 바뀌었거나 주소가 잘못 복사됐어요. 관리자에게 새 가족 주소를 받아 주세요.'; }
  else if (s === 'loggedOut') { title = '다시 등록해 주세요'; body = '비밀 키가 바뀌어서 이 폰이 로그아웃됐어요. 관리자에게 새 가족 주소를 받아 열어 주세요.'; }
  else if (s === 'loggedOutSelf') { title = '로그아웃했어요'; body = '이 폰에 저장된 키와 사용자 정보를 지웠어요. 다시 쓰려면 가족 주소를 열어 주세요. 홈 화면 아이콘도 지워 주세요.'; }

function renderToday(d) {
  var h = '';

    h += '<div class="alert" role="alert"><div style="display:flex;gap:10px">' + ICON.warn + '<span>' + esc(S.warn.text) + '</span></div>';
    if (S.warn.actions && S.warn.actions.length) {

      }).join('') + '</div>';
    }
    h += '</div>';
  }
  h += '<div class="daybar"><button class="navbtn" data-act="dayShift" data-v="-1" aria-label="전날"' + (d.date <= d.minDate ? ' disabled' : '') + '>‹</button>' +
    '<div class="lbl2"><b>' + relDay(d.date, d.today) + '</b><span class="sub">' + esc(d.dateLabel) + '</span></div>' +
    '<button class="navbtn" data-act="dayShift" data-v="1" aria-label="다음날"' + (d.isToday ? ' disabled' : '') + '>›</button></div>';
  if (!d.isToday) {
    h += '<div class="card" style="background:var(--blue-soft);border-color:#B9CBF5;gap:8px"><span class="h2">' + relDay(d.date, d.today) + ' 먹은 약 기록하기</span>' +

      '<button class="btn ghost" style="align-self:flex-start" data-act="gotoDay" data-v="">오늘로 돌아가기</button></div>';
  }
  var sched = d.meds.filter(function (m) { return !m.prn; });
  var prn = d.isToday ? d.meds.filter(function (m) { return m.prn; }) : [];
  var times = [];
  sched.forEach(function (m) { m.times.forEach(function (t) { if (times.indexOf(t) < 0) times.push(t); }); });
  times.sort();

  if (!d.meds.length) {
    h += '<div class="card"><div class="h2">아직 등록된 약이 없어요</div><div class="sub">먼저 먹는 약을 추가해 주세요.</div><button class="btn wide" data-act="openAddMed">+ 약 추가</button></div>';
    return h;
  }

  times.forEach(function (t) {
    var due = sched.filter(function (m) { return m.times.indexOf(t) >= 0; });

    var all = done === due.length;
    h += '<div class="card' + (all ? ' done' : '') + '"><div class="between"><span class="slot-time">' + t + '</span><span class="sub' + (all ? ' ok' : '') + '">' + (all ? '모두 완료' : done + ' / ' + due.length + ' 완료') + '</span></div>';
    due.forEach(function (m) {
      var tk = d.taken[m.id + '|' + t];
      h += '<div class="row"><div class="info"><span class="name">' + esc(m.name) + ' <small>' + esc(m.dose) + '</small></span>' +
        '<span class="sub' + (tk ? ' ok' : '') + '">' + (tk ? esc(tk.by) + ' · ' + esc(tk.at) + ' 기록' : '아직 기록 없음') + '</span></div>' +
        '<button class="btn' + (tk ? ' done' : '') + '" data-act="dose" data-v="' + esc(m.id + '|' + t) + '"' + (S.busy ? ' disabled' : '') + '>' + (tk ? '완료' : '먹었어요') + '</button></div>';
    });
    h += '</div>';
  });

  if (prn.length) {
    h += '<div class="card"><div style="display:flex;flex-direction:column;gap:2px"><span class="h2">필요할 때 먹는 약</span><span class="sub">머리가 아플 때 등 정해진 시간 외에 먹은 약</span></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px"><span class="sub" style="font-weight:600;color:var(--ink2)">먹은 이유</span><div class="chips">' +
      d.reasons.map(function (r) { return chip(r, S.reason === r, 'reason'); }).join('') + '</div></div>';
    prn.forEach(function (m) {
      var mine = d.prnToday.filter(function (x) { return x.medId === m.id; });
      var last = mine[mine.length - 1];
      var pending = S.pendingPrn === m.id;
      h += '<div class="row"><div class="info"><span class="name">' + esc(m.name) + ' <small>' + esc(m.dose) + '</small></span>' +
        '<span class="sub' + (last ? ' ok' : '') + '">' + (last ? '오늘 ' + mine.length + '회 · 마지막 ' + esc(last.by) + ' ' + esc(last.at) + ' (' + esc(last.reason) + ')' : '오늘 0회 · 최소 ' + esc(m.gapH) + '시간 간격') + '</span></div>' +
        '<button class="btn ' + (pending ? 'orange' : 'outline') + '" data-act="prn" data-v="' + esc(m.id) + '"' + (S.busy ? ' disabled' : '') + '>' + (pending ? '그래도 기록' : '먹었어요') + '</button></div>';
    });
    h += '</div>';
  }

  if (!d.isToday) return h;
  h += '<div class="card"><div class="between" style="align-items:center"><span class="h2">복용 중인 약</span><button class="btn ghost" data-act="openAddMed">+ 약 추가</button></div>';
  d.meds.forEach(function (m) {
    var pct = 0, txt = '남은 양 미입력';
    if (m.stock != null) {
      txt = m.stock + esc(m.unit) + (m.daysLeft != null ? ' · ' + m.daysLeft + '일분' : '');
      pct = m.daysLeft != null ? Math.min(100, Math.round(m.daysLeft / 60 * 100)) : Math.min(100, m.stock);
    }
    h += '<div style="display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line2)">' +
      '<div style="display:flex;align-items:center;gap:10px"><div class="info" style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0"><span class="name">' + esc(m.name) + '</span>' +
      '<span class="sub" style="color:var(--ink2)">' + esc(m.dose) + ' · ' + (m.prn ? '필요할 때 · 최소 ' + esc(m.gapH) + '시간 간격' : esc(m.times.join(' · '))) + '</span></div>' +
      '<button class="btn ghost" data-act="openEditMed" data-v="' + esc(m.id) + '" aria-label="' + esc(m.name) + ' 수정">수정</button></div>' +
      '<div style="display:flex;align-items:center;gap:10px"><div class="bar"><i class="' + (m.low ? 'low' : '') + '" style="width:' + pct + '%"></i></div>' +
      '<span class="sub' + (m.low ? ' warn' : '') + '" style="white-space:nowrap">' + txt + '</span></div></div>';
  });
  h += '<div class="sub">[수정]에서 이름·용량·시간·남은 양을 바꾸거나 복용을 중단할 수 있어요.</div></div>';
  return h;
}

}
function renderVisits() {
  var h = '<button class="btn wide" data-act="openVisit" data-v="">+ 상담·검사 기록 추가</button>' +
    '<div class="chips">' + ['전체'].concat(VISIT_KINDS).map(function (k) { return chip(k, S.vfilter === k, 'vfilter'); }).join('') + '</div>';
  if (!S.visits) return h + '<div class="card"><div class="spinner" aria-label="불러오는 중"></div></div>';
  var list = S.visits.filter(function (v) { return S.vfilter === '전체' || v.kind === S.vfilter; });
  if (!list.length) return h + '<div class="card"><div class="empty">아직 기록이 없어요</div></div>';
  list.forEach(function (v) {
    var open = S.vopen === v.id;
    h += '<div class="card" style="gap:10px"><div class="between" style="align-items:center"><span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' + kindBadge(v.kind) +
      '<b style="font-size:15px">' + ymdLabel(v.date) + '</b></span><button class="btn ghost" data-act="openVisit" data-v="' + esc(v.id) + '" aria-label="' + esc(v.date + ' ' + v.kind) + ' 기록 수정">수정</button></div>';
    if (v.kind === '검사') {
      h += '<div><div class="vlabel">검사 내용</div><div class="vtext">' + esc(v.testName) + '</div></div>' +
        '<div><div class="vlabel">검사 결과</div>' + (v.result ? '<div class="vtext' + (open ? '' : ' clamp') + '">' + esc(v.result) + '</div>' : '<div class="sub warn">결과 대기 · 나오면 [수정]에서 적어 주세요</div>') + '</div>';
    } else {
      var meta = [v.teacher && ('담당 ' + v.teacher), v.time && ('시간 ' + v.time)].filter(Boolean).join(' · ');
      if (meta) h += '<div class="sub" style="color:var(--ink2)">' + esc(meta) + '</div>';
      if (v.content) h += '<div><div class="vlabel">상담 내용</div><div class="vtext' + (open ? '' : ' clamp') + '">' + esc(v.content) + '</div></div>';
    }
    var long = (v.kind === '검사' ? v.result : v.content) || '';
    if (long.split('\n').length > 4 || long.length > 120) {
      h += '<button class="btn ghost" style="align-self:flex-start" data-act="vtoggle" data-v="' + esc(v.id) + '">' + (open ? '접기' : '전체 보기') + '</button>';
    }
    h += '<div class="sub">기록: ' + esc(v.by) + (v.updatedAt ? ' · 수정함' : '') + '</div></div>';
  });
  return h;
}
function renderVisitForm() {
  var f = S.vform, isTest = f.kind === '검사';
  var teachers = [];
  (S.visits || []).forEach(function (v) { if (v.kind === f.kind && v.teacher && teachers.indexOf(v.teacher) < 0) teachers.push(v.teacher); });
  var title = f.id ? '기록 수정' : '상담·검사 기록';
  var h = '<div class="overlay" data-act="closeSheet" data-self="1"><div class="sheet" role="dialog" aria-label="' + title + '">' +
    '<div class="between" style="align-items:center"><span style="font-size:18px;font-weight:800">' + title + '</span><button class="btn ghost" data-act="closeSheet">닫기</button></div>' +
    '<div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">구분</span><div class="chips" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr))">' +
    VISIT_KINDS.map(function (k) { return chip(k, f.kind === k, 'vKind'); }).join('') + '</div></div>' +
    '<div class="field"><label class="lbl" for="vDate">날짜</label><input id="vDate" type="date" value="' + esc(f.date) + '" data-in="vform.date"></div>';
  if (isTest) {
    h += '<div class="field"><label class="lbl" for="vTest">검사 내용</label><input id="vTest" value="' + esc(f.testName) + '" placeholder="예: 뇌파검사(EEG), 혈액검사" maxlength="500" data-in="vform.testName"></div>' +
      '<div class="field"><label class="lbl" for="vResult">검사 결과</label><textarea id="vResult" rows="6" placeholder="결과가 아직 없으면 비워 두고, 나중에 [수정]에서 적어도 돼요" data-in="vform.result">' + esc(f.result) + '</textarea></div>';
  } else {
    h += '<div class="grid2"><div class="field"><label class="lbl" for="vTeacher">담당 선생님</label><input id="vTeacher" value="' + esc(f.teacher) + '" placeholder="예: 김OO 선생님" maxlength="40" list="vTeacherList" data-in="vform.teacher">' +
      '<datalist id="vTeacherList">' + teachers.map(function (t) { return '<option value="' + esc(t) + '"></option>'; }).join('') + '</datalist></div>' +
      '<div class="field"><label class="lbl" for="vTime">상담 시간</label><input id="vTime" value="' + esc(f.time) + '" placeholder="예: 15:00~15:50" maxlength="40" data-in="vform.time"></div></div>' +
      '<div class="field"><label class="lbl" for="vContent">상담 내용</label><textarea id="vContent" rows="8" placeholder="선생님이 하신 말씀, 다음에 할 일 등을 적어 두세요" data-in="vform.content">' + esc(f.content) + '</textarea></div>';
  }
  h += '<button class="btn wide" data-act="saveVisit"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '저장 중…' : '저장하기') + '</button>';
  if (f.id) h += '<button class="btn wide outline" style="border-color:var(--orange);color:var(--orange)" data-act="deleteVisit"' + (S.busy ? ' disabled' : '') + '>이 기록 삭제</button>';
  return h + '</div></div>';
}
function loadVisits() {
  call('api_visits', S.key).then(function (list) { S.visits = list; render(); }, function (e) { toast('불러오지 못했어요: ' + e.message, true); });
}

function renderSettings() {
  return '<div class="overlay" data-act="closeSheet" data-self="1"><div class="sheet" role="dialog" aria-label="설정">' +
    '<div class="between" style="align-items:center"><span style="font-size:18px;font-weight:800">설정</span><button class="btn ghost" data-act="closeSheet">닫기</button></div>' +
    '<div class="list"><div>이 폰 기본 사용자: <b>' + esc(S.who) + '</b></div><div>위쪽 이름 버튼을 누르면 바뀌고, 이 폰에 기억돼요.</div></div>' +
    (APP_URL ? '<a class="btn wide outline" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="' + esc(APP_URL) + '">홈 화면용 주소 열기</a>' : '') +
    '<button class="btn wide orange" data-act="logout">이 폰에서 로그아웃</button>' +
    '<div class="sub">로그아웃하면 이 폰에 저장된 비밀 키가 지워져요. 다른 가족 폰과 기록에는 영향이 없어요. 폰을 잃어버렸다면 관리자가 비밀 키를 바꿔야 해요.</div>' +
    '</div></div>';
}

// ───── 동작 ─────
var ACTIONS = {
  pickFirstWho: function (v) { S.who = v; store('who', v); enterMain(); },
  who: function (v) { S.who = v; store('who', v); S.warn = null; S.pendingPrn = null; render(); },
  tab: function (v) {
    S.tab = v; S.warn = null; S.pendingPrn = null;
    if (v === 'today') S.day = '';
    if (v === 'cal') loadMonth();
    if (v === 'visit') loadVisits();
    if (v === 'today') refresh();
    render(); window.scrollTo(0, 0);
  },
  dayShift: function (v) {
    var d = S.data, next = shiftDay(d.date, Number(v));
    if (next > d.today || next < d.minDate) return;
    S.day = next === d.today ? '' : next; S.warn = null; S.pendingPrn = null;
    refresh(); window.scrollTo(0, 0);
  },
  gotoDay: function (v) {
    S.day = S.data && v === S.data.today ? '' : v; S.tab = 'today'; S.warn = null; S.pendingPrn = null;
    render(); refresh(); window.scrollTo(0, 0);
  },
  vfilter: function (v) { S.vfilter = v; render(); },
  vtoggle: function (id) { S.vopen = S.vopen === id ? null : id; render(); },
  openVisit: function (id) {
    var v = id && (S.visits || []).filter(function (x) { return x.id === id; })[0];
    S.vform = v
      ? { id: v.id, kind: v.kind, date: v.date, teacher: v.teacher, time: v.time, content: v.content, testName: v.testName, result: v.result }
      : { id: '', kind: S.vfilter !== '전체' ? S.vfilter : '상담센터', date: todayYMD(), teacher: '', time: '', content: '', testName: '', result: '' };
    S.sheet = 'visit'; render();
  },
  vKind: function (v) { S.vform.kind = v; render(); },
  saveVisit: function () {
    var f = S.vform;
    if (!f.date) { toast('날짜를 골라 주세요'); return; }
    if (f.kind === '검사' ? !f.testName.trim() : !(f.teacher.trim() || f.content.trim())) {
      toast(f.kind === '검사' ? '검사 내용을 적어 주세요' : '담당 선생님이나 상담 내용을 적어 주세요'); return;
    }
    act('api_saveVisit', S.who, f).then(function (res) {
      if (!res) return;
      S.visits = res.visits; S.sheet = null; render();
      toast(f.id ? '기록을 고쳤어요' : f.kind + ' 기록을 저장했어요');
    });
  },
  deleteVisit: function () {
    var f = S.vform;
    if (!confirm('이 기록을 삭제할까요? 되돌릴 수 없어요.')) return;
    act('api_deleteVisit', f.id).then(function (res) {
      if (!res) return;
      S.visits = res.visits; S.sheet = null; render();
      toast('기록을 삭제했어요');
    });
  },
  dismissReg: function () { S.justRegistered = false; render(); },
  openSettings: function () { S.sheet = 'settings'; render(); },
  openAddMed: function () { S.form = { name: '', dose: '', stock: '', prn: false, times: [], gapH: 4 }; S.sheet = 'addMed'; render(); },
  closeSheet: function () { S.sheet = null; render(); },
  logout: function () { if (confirm('이 폰에서 로그아웃할까요?')) logout(false); },
  reason: function (v) { S.reason = v; render(); },
  dose: function (v) {
    var p = v.split('|'), id = p[0], slot = p[1];
    var med = S.data.meds.filter(function (m) { return m.id === id; })[0];
    var tk = S.data.taken[v];
    S.pendingPrn = null;
    if (tk) {
      S.warn = { text: '이미 ' + tk.by + iGa(tk.by) + ' ' + tk.at + '에 ' + slot + ' ' + med.name + '을(를) 기록했어요. 두 번 먹지 않도록 확인하세요.',
        actions: [{ label: '기록 취소', act: 'undo', v: v }, { label: '확인', act: 'clearWarn', primary: true }] };
      render(); return;
    }
    S.warn = null;
    var dayName = S.day ? relDay(S.data.date, S.data.today) + ' ' : '';
    act('api_takeDose', S.who, id, slot, S.day).then(function (res) {
      if (!res) return;
      if (res.status === 'dup') {
        S.warn = { text: '방금 ' + res.by + iGa(res.by) + ' ' + res.at + '에 먼저 기록했어요. 두 번 먹지 않도록 확인하세요.', actions: [{ label: '확인', act: 'clearWarn', primary: true }] };
        render();
      } else toast(dayName + slot + ' ' + med.name + ' 기록됨 · 가족 화면에도 보여요');
    });
  },
  undo: function (v) {
    var p = v.split('|');
    if (!confirm('이 기록을 취소할까요?')) return;
    S.warn = null;
    act('api_undoDose', p[0], p[1], S.day).then(function (res) { if (res) toast('기록을 취소했어요'); });
  },
  clearWarn: function () { S.warn = null; S.pendingPrn = null; render(); },
  prn: function (id) {
    var med = S.data.meds.filter(function (m) { return m.id === id; })[0];
    var force = S.pendingPrn === id;
    act('api_takePrn', S.who, id, S.reason, force).then(function (res) {
      if (!res) return;
      if (res.status === 'tooSoon') {
        S.pendingPrn = id;
        S.warn = { text: '마지막 복용(' + (res.sameDay ? '' : '어제 ') + res.by + ' · ' + res.at + ') 후 ' + res.hoursAgo + '시간밖에 안 지났어요. 최소 간격은 ' + res.gapH + '시간이에요.',
          actions: [{ label: '그래도 기록', act: 'prn', v: id }, { label: '취소', act: 'clearWarn', primary: true }] };
        render();
      } else {
        S.pendingPrn = null; S.warn = null;
        toast(med.name + ' 기록됨 · 이유: ' + S.reason);
      }
    });
  },
  formKind: function (v) { S.form.prn = v === '1'; render(); },
  formTime: function (v) { var t = S.form.times, i = t.indexOf(v); if (i >= 0) t.splice(i, 1); else t.push(v); render(); },
  formGap: function (v) { S.form.gapH = Number(v); render(); },
  saveMed: function () {
    var f = S.form;
    if (!f.name.trim()) { toast('약 이름을 적어 주세요'); return; }
    if (!f.prn && !f.times.length) { toast('복용 시간을 하나 이상 골라 주세요'); return; }
    var p = f.id ? act('api_updateMed', f.id, f) : act('api_addMed', f);
    p.then(function (res) { if (res) { S.sheet = null; toast(f.name + (f.id ? ' 수정됨' : ' 추가됨')); } });
  },
  openEditMed: function (id) {
    var m = S.data.meds.filter(function (x) { return x.id === id; })[0];
    if (!m) return;
    S.form = {
      id: m.id, name: m.name, dose: m.dose === '-' ? '' : m.dose,
      stock: m.stock == null ? '' : m.stock + (m.unit || ''),
      prn: m.prn, times: m.times.slice(), gapH: m.gapH || 4
    };
    S.sheet = 'addMed'; render();
  },
  stopMed: function () {
    var f = S.form;
    if (!confirm(f.name + ' 복용을 중단할까요?\n오늘 화면에서 빠지고, 지난 기록은 남아요.')) return;
    act('api_stopMed', f.id).then(function (res) { if (res) { S.sheet = null; toast(f.name + ' 복용 중단됨'); } });
  },
  szOne: function (v) { var i = v.indexOf('|'); var k = v.slice(0, i), x = v.slice(i + 1); S.sz[k] = S.sz[k] === x ? '' : x; render(); },
  szAura: function (v) { var a = S.sz.aura, i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); render(); },
  saveSz: function () {
    var z = S.sz;
    if (!z.type) { toast('종류를 골라 주세요'); return; }
    act('api_saveSeizure', S.who, z).then(function (res) {
      if (!res) return;
      S.sz = null; S.tab = 'today'; S.monthData = null; refresh();
      toast('상담대비 기록을 저장했어요 · 가족 화면 달력에도 보여요');
      window.scrollTo(0, 0);
    });
  },
  month: function (v) {
    var m = S.month.m + Number(v), y = S.month.y;
    if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
    S.month = { y: y, m: m }; S.selDay = null; loadMonth(); render();
  },
  day: function (v) { S.selDay = S.selDay === v ? null : v; render(); }
};

function loadMonth() {
  if (!S.month) { var n = new Date(); S.month = { y: n.getFullYear(), m: n.getMonth() + 1 }; }
  var want = S.month;
  call('api_month', S.key, want.y, want.m).then(function (md) {
    if (S.month.y === want.y && S.month.m === want.m) { S.monthData = md; render(); }
  }, function (e) { toast('달력을 불러오지 못했어요: ' + e.message); });
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.getAttribute('data-self') && e.target !== el) return;
  var fn = ACTIONS[el.getAttribute('data-act')];
  if (fn && !el.disabled) { e.preventDefault(); fn(el.getAttribute('data-v') || ''); }
});
document.addEventListener('input', function (e) {
  var path = e.target.getAttribute && e.target.getAttribute('data-in');
  if (!path) return;
  var p = path.split('.');
  if (S[p[0]]) S[p[0]][p[1]] = e.target.value;
  if (p[0] === 'form') {
    var f = S.form, btn = document.querySelector('[data-act="saveMed"]');
    if (btn) btn.className = 'btn wide' + (f.name.trim() && (f.prn || f.times.length) ? '' : ' gray');
  }
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && S.screen === 'main' && S.tab === 'today') refresh();
});
setInterval(function () {
  if (document.visibilityState === 'visible' && S.screen === 'main' && S.tab === 'today' && !S.busy && !S.sheet) refresh();
}, 60000);

start();
</script>
</body>
</html>
